# cloudbuild.yaml de referencia para el patrón "ADO -> gcloud builds submit -> Cloud Run".
#
# Es la FUENTE DE VERDAD del despliegue: el pipeline de Azure DevOps solo lo ejecuta, no duplica
# sus flags. Cualquier servicio que cumpla este contrato se despliega con las plantillas de
# pipelines/ sin tocar nada más en GCP.
#
# Contrato con el pipeline:
#   - _SERVICE_NAME  lo pasa el pipeline (--substitutions).
#   - COMMIT_SHA     lo pasa el pipeline explícito (Cloud Build solo lo rellena en triggers).
#   - PROJECT_ID     lo rellena Cloud Build siempre.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_RUN_SA}
      - --set-env-vars=ENVIRONMENT=${_ENVIRONMENT},LOG_LEVEL=${_LOG_LEVEL}
      # Los secretos SIEMPRE desde Secret Manager, nunca como variable de entorno en claro:
      # - --set-secrets=API_KEY=API_KEY:latest
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'

substitutions:
  _SERVICE_NAME: my-service-qa
  _REGION: us-central1
  _REPOSITORY: cloud-run-images
  _RUN_SA: cloudrun-runtime@my-gcp-project.iam.gserviceaccount.com
  _ENVIRONMENT: qa
  _LOG_LEVEL: INFO
  _MIN_INSTANCES: '0'      # QA/preproducción: escalar a cero
  _MAX_INSTANCES: '3'
  _MEMORY: 512Mi
  _CPU: '1'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'

options:
  logging: CLOUD_LOGGING_ONLY   # exige logging.logWriter en la SA del build

timeout: 1200s
