name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/wif-setup.sh tests/run.sh tests/bin/gcloud
      - name: pruebas del script contra un gcloud simulado
        run: bash tests/run.sh

  pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest
      - name: validar plantillas y cloudbuild.yaml
        run: pytest -q
